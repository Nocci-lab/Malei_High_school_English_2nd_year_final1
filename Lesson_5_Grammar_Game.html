<!DOCTYPE html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 5 Grammar</title><style>body{font:18px/1.8 system-ui,sans-serif;background:#eaf6fc;color:#16364c;margin:0}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:28px}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:#125d80;color:white}button:disabled{opacity:.5}article{background:white;border-radius:20px;padding:24px;margin:20px 0;min-height:430px}input{font:inherit;width:110px;margin:5px;padding:8px;border:2px solid #83b6cf;border-radius:8px}input.jp{width:95%;text-align:left}strong{color:#075a80}#feedback{padding:16px;background:#eff9f4;margin:16px 0}#english{font-size:21px;line-height:2.6}.muted{font-size:15px;color:#506576}button:focus-visible,input:focus{outline:3px solid #efbc42}progress{width:100%}p{white-space:pre-line}@media(max-width:500px){main{padding:12px}article{padding:16px}input{width:85px}}</style><main><h1>Lesson 5 · Background Music and Sharks</h1><nav id="nav"></nav><p id="progress"></p><progress id="bar" value="0" max="1"></progress><article id="card"></article></main><script>
const groups=['G1','G2','Ex1','Ex2','プリント問題'];const data=[];
function q(s,n,j,t,e,words='',jp=false){data.push({s,n,j,t,e,words,jp})}
q(0,'1','BGMが内容の解釈にどう影響するかを、制作者と視聴者の双方が意識することが重要です。',"It is {important for both producers and viewers to be aware of} how background music affects people's interpretation of the content.",'It is 形容詞 for 人 to do。itは形式主語。for以下が不定詞の意味上の主語。be aware ofは「～を意識している」。');
q(0,'2','サメに対する否定的な態度は、環境保護活動家が保護への支持を得ることを難しくします。','Negative {attitudes} toward sharks {make it difficult for environmentalists to gain support} for their protection.','make it 形容詞 for 人 to do。itは形式目的語で、内容は後ろのto gain support。attitudesは「態度」の複数形。');
q(0,'3','ドキュメンタリーの視聴者は、BGMに惑わされないよう注意すべきです。','{Viewers} of documentaries should be careful {not to be misled by} background music.','不定詞の否定はnot to。to be misledは受け身で「惑わされる」。misledはmisleadの過去分詞。');
q(1,'1','これは、映像と音楽が組み合わされると、音楽の選択が人々のサメに対する印象に強く影響することを示しているように思われます。',"This {seems|appears to indicate that} the choice of music strongly affects people's impressions of sharks when video and music are combined.",'seems / appears to indicateで「示しているようだ」。現在の内容を現在判断しています。');
q(1,'2','ジャックは試験に合格したように思われます。','Jack {seems|appears to have passed} the exam.','現在のseemsより前に合格したので、to have passedを使います。');
q(1,'3','アニーは昨日少し元気がなかったように思われました。','Annie {seemed|appeared to be} a little down yesterday.','過去の判断seemedと元気がない状態が同時なのでto be。');
q(1,'4','ジャックは試験に合格していたように思われました。','Jack {seemed|appeared to have passed} the exam.','過去の判断seemedより、合格した時がさらに前なのでto have passed。');
q(2,'1','A：あなたのような良いサッカー選手になりたいです。助言をもらえますか。\nB：毎日練習することがあなたにとって重要だと思います。','A: I want to be a good soccer player like you. Could you give me advice?\nB: I think it is {important for you to practice} every day.','for youは練習する人。It is important for you to practiceの形です。');
q(2,'2','A：野球をしに公園へ行ったと思っていました。\nB：宿題がたくさんあるので、行かないことにしました。','A: I thought you went to the park to play baseball.\nB: I decided {not to go} because I have a lot of homework.','decide not to doで「～しないことに決める」。notはtoの直前。');
q(2,'3 · model','長年教えてきたので、私にとって英語を教えることは簡単です。一方、フランス語を流暢に話すことは難しいです。','{It is easy for me to teach English} because I have taught it for many years. On the other hand, it {is difficult for me to speak} French fluently.','It is easy / difficult for me to do。for meは意味上の主語。赤線部分だけを入力します。');
q(3,'1','A：ユカはフランス語をとても上手に話しますね。\nB：そうですね。フランスで勉強したことがあるようです。',"A: Yuka speaks French very well, doesn't she?\nB: That's right. She {seems|appears to have studied} in France. [study]",'今の判断より前の留学・勉強なのでto have studied。');
q(3,'2','A：彼はその事件に関係がないと言っていました。どう思いますか。\nB：疑わしいですね。彼は事件について何か知っているようでした。','A: He said he had nothing to do with the case. What do you think?\nB: I doubt it. He {seemed|appeared to know} something about the case. [know]','当時「知っているようだった」のでseemed to know。過去の判断と知っている状態が同時です。');
q(3,'3 · model','あなたはとても具合が悪いようです。今日は学校を早退すべきです。','You {appear|seem to be very sick}. You should leave school early today.','appear / seem to be + 形容詞で「～のようだ」。主語がyouなのでappear / seem。');
q(4,'練習① 1','雨のせいで、私たちは外に出るのが難しかった。','The rain {made it difficult|hard} for us to go outside.','make it difficult for 人 to do。過去なのでmade。difficult / hardのどちらも可。');
q(4,'練習① 2','彼は今、とても疲れているようだ。','He seems {to be} very tired now.','現在の判断と現在の状態なのでto be。');
q(4,'練習① 3','彼女は昨夜、よく眠れたようだ。（今そう見える）','She seems {to have slept} well last night.','昨夜の睡眠を今判断するのでto have slept。sleepの過去分詞はslept。');
q(4,'練習① 4','彼女はすでにその知らせを聞いていたようだった。','She {seemed|appeared to have heard} the news already.','過去の判断より前に聞いていたのでseemed to have heard。');
q(4,'練習① 5','彼にとって、その質問に答えるのは簡単だった。','{It was easy} for him to answer the question.','過去なのでwas。It was easy for him to answerの形です。');
q(4,'練習① 6','彼はその場所に行かないように気をつけた。','He was careful {not to} go to that place.','不定詞の否定はnot to go。');
q(4,'練習② 1','彼の助言のおかげで、彼女はその問題を解くことができた（可能になった）。','{His advice made it possible for her to solve} the problem.','His adviceが主語。made it possible for her to solveで「彼女が解くことを可能にした」。','for her / it / his advice / possible / made / to solve');
q(4,'練習② 2','彼女はその事故について何でも知っているようだ。','She {seems to know everything about} the accident.','seems to knowの後に目的語everything、about the accidentが続きます。','about / everything / know / to / seems');
q(4,'練習② 3','トムは以前、ここに住んでいたようだ。','Tom {seems to have lived here} before.','以前住んでいたことを今判断するのでseems to have lived。','lived / to / here / have / seems');
q(4,'練習② 4','彼らは会社を出たようだった。','They {seemed to have left the office}.','出たのは過去の判断より前なのでseemed to have left。','the / seemed / office / to / left / have');
q(4,'練習② 5','子供たちがその通りで遊ぶのは危険だ。','{It is dangerous for children to} play in the street.','Itは形式主語。for childrenはplayの意味上の主語。','for / to / is / dangerous / it / children');
q(4,'練習② 6','彼は二度と同じ間違いをしないと決心した。','He decided {never to make the same mistake} again.','never to doで「決して～しない」。neverはtoの前。','make / never / the same mistake / to');
const notes=[['1','Smartphones make it easy for students to find information.','スマートフォンは学生が情報を見つけることを容易にする。','S make it 形容詞 (for A) to do：Aが～することを…にする。itは形式目的語。'],['2','He seems to know the truth.','彼は真実を知っているようだ。','seem / appear to do：～するようだ。知っている時と判断する時が同時。'],['発展①','He seems to have known the truth then.','彼はその時、真実を知っていたようだ。','seem to have done：～した（していた）ようだ。過去の状態を今判断。'],['発展②','He seemed to have known the truth then.','彼はその時、真実を知っていたようだった。','seemed to have done：～していたようだった。過去の判断より前の状態。'],['3','It is important for us to get enough sleep.','私たちが十分な睡眠をとることは重要だ。','It is 形容詞 (for A) to do：Aが～することは…だ。'],['4','You will take a test tomorrow. Be careful not to catch a cold.','明日テストだね。風邪をひかないように気を付けて。','不定詞の否定：not / neverをtoの前に置く。']];
const noteTemplates=[
 'Smartphones {make it easy for students to find} information.',
 'He {seems|appears to know} the truth.',
 'He {seems|appears to have known} the truth then.',
 'He {seemed|appeared to have known} the truth then.',
 '{It is important for us to get} enough sleep.',
 'You will take a test tomorrow. Be careful {not to catch} a cold.'
];
const extra=notes.map((x,i)=>({s:4,n:'文法プリント '+x[0]+' 穴埋め',j:x[2],t:noteTemplates[i],e:x[3],jp:false}));
extra.push({s:4,n:'文法プリント 規則',j:'S make it 形容詞 (for A) to do の意味を答えよう。',t:'{Aが～することを…にする}',e:'itは形式目的語。to doがその内容です。',jp:true});
extra.push({s:4,n:'文法プリント 2 語句',j:'seemと同じ意味の動詞を完成させよう。',t:'seem, (a{ppear}) to do',e:'appear to doも「～するようだ」。'});
extra.push({s:4,n:'文法プリント 2 規則',j:'seem / appear to doの意味を答えよう。',t:'{～するようだ}',e:'判断と不定詞の内容が同時。',jp:true});
extra.push({s:4,n:'文法プリント 発展① 規則',j:'seem / appear to have doneの意味を答えよう。',t:'{～したようだ}',e:'今の判断より前の内容。',jp:true});
extra.push({s:4,n:'文法プリント 発展② 規則',j:'seemed / appeared to have doneの意味を答えよう。',t:'{～していたようだった}',e:'過去の判断よりさらに前の内容。',jp:true});
extra.push({s:4,n:'文法プリント 3 規則',j:'It is 形容詞 (for A) to doの意味を答えよう。',t:'{Aが～することは…だ}',e:'itは形式主語。for Aは意味上の主語。',jp:true});
extra.push({s:4,n:'文法プリント 4 規則',j:'不定詞の否定：否定語2つと置く位置を答えよう。',t:'{not}、{never}をtoの{前|直前}に置く。',e:'not / neverをtoの前に置きます。'});
data.splice(13,0,...extra);
let section=0,queue=[],current,checked=false,done=new Set(),mistakes=0;const $=id=>document.getElementById(id);const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function tokens(q){return [...q.t.matchAll(/\{([^}]+)\}/g)].flatMap(m=>m[1].split(' '))}function full(q){return q.t.replace(/\{([^}]+)\}/g,(_,s)=>s.split(' ').map(w=>w.split('|')[0]).join(' '))}function norm(s){return s.normalize('NFKC').trim().toLowerCase().replace(/[’‘]/g,"'")}
function progress(){ $('progress').textContent=`習得 ${done.size} / ${data.length}問`; $('bar').value=done.size/data.length; }
function start(s){section=s;queue=data.map((x,i)=>i).filter(i=>data[i].s===s&&!done.has(i));next()}
function next(){checked=false;if(!queue.length){endSection();return}current=queue.shift();const q=data[current];$('card').innerHTML=`<h2>${groups[section]} · ${q.n}</h2><p>${esc(q.j)}</p>${q.words?`<p class="muted">先生の語群：${esc(q.words)}<br>語群を並べ、空欄1つに1語ずつ入力してください。</p>`:'<p class="muted">空欄1つに1語ずつ入力してください。</p>'}<div id="english">${esc(q.t).replace(/\{([^}]+)\}/g,(_,s)=>s.split(' ').map((w)=>'<input aria-label="英語の空欄" autocomplete="off" autocapitalize="none" spellcheck="false">').join(''))}</div><button id="check">チェック</button><div id="feedback" hidden></div><button id="next" hidden>解説を読んだ → 次へ</button>`;$('check').onclick=check;$('next').onclick=next;}
function check(){if(checked)return;const inputs=[...document.querySelectorAll('#english input')];if(inputs.some(i=>!i.value.trim())){alert('空欄をすべて入力してからチェックしてください。');return}checked=true;const a=tokens(data[current]);const ok=inputs.every((i,n)=>a[n].split('|').some(w=>norm(w)===norm(i.value)));inputs.forEach((i,n)=>{i.disabled=true;i.style.borderColor=a[n].split('|').some(w=>norm(w)===norm(i.value))?'#13805c':'#b83b43'});if(ok)done.add(current);else{mistakes++;queue.push(current)}$('feedback').hidden=false;$('feedback').innerHTML=`<strong>${ok?'正解！':'あとでもう一度挑戦しよう'}</strong><p>${esc(full(data[current]))}</p><p>${esc(data[current].e)}</p><button id="speak">英文を聞く</button>`;$('speak').onclick=()=>{if(!window.speechSynthesis)return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(full(data[current]));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};$('check').hidden=true;$('next').hidden=false;progress()}
const automaticCheck=check;
check=function(){if(!data[current].jp){automaticCheck();return}if(checked)return;const input=document.querySelector('#english input');if(!input.value.trim()){alert('和訳・意味を入力してください。');return}checked=true;input.disabled=true;$('check').hidden=true;$('feedback').hidden=false;$('feedback').innerHTML='<strong>解答例と意味を比べよう</strong><p>'+esc(full(data[current]))+'</p><p>'+esc(data[current].e)+'</p><p>日本語は表現の違いがあるので、意味が同じなら正解です。</p><button id="yes">意味が合っていた</button> <button id="no">違っていた・あとで復習</button>';$('yes').onclick=()=>{done.add(current);progress();next()};$('no').onclick=()=>{mistakes++;queue.push(current);next()}};
const originalNext=next;
next=function(){originalNext();if(current!==undefined&&data[current].jp&&$('english')){document.querySelectorAll('#english input').forEach(i=>i.classList.add('jp'));const hint=$('english').previousElementSibling;if(hint)hint.textContent='日本語で答えてください。チェック後に解答例と照合します。'}};
function endSection(){$('card').innerHTML=`<h2>${groups[section]} クリア！</h2><p>このセクションの全問を正解できました。</p><button id="continue">${section<4?'次のセクションへ':'完了結果を見る'}</button>`;$('continue').onclick=()=>section<4?start(section+1):finish()}
function finish(){$('card').innerHTML=done.size===data.length?`<h2>全問クリア！</h2><p>よくやったね！ 教科書とプリントの全${data.length}問を正解できました。</p><p>復習になった回数：${mistakes}回</p>`:'<h2>残りのセクションも完成させよう</h2><p>上のボタンから選べます。</p>'}
function answerMarkup(q){return [...q.t.matchAll(/\{([^}]+)\}/g)].map(m=>'<strong>'+esc(m[1].split(' ').map(w=>w.split('|').join(' / ')).join(' '))+'</strong>').join(' ｜ ')}
const previousCheck=check;check=function(){const wasChecked=checked;previousCheck();if(!wasChecked&&checked&&$('feedback')){const p=document.createElement('p');p.innerHTML='空欄の答え：'+answerMarkup(data[current]);$('feedback').insertBefore(p,$('feedback').children[1]);}};
function say(text,lang='en-US'){if(!window.speechSynthesis){alert('このブラウザでは読み上げを利用できません。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.85;speechSynthesis.speak(u)}
let readingDone=false;
function reading(){if(window.speechSynthesis)speechSynthesis.cancel();$('card').innerHTML='<h2>教科書 · 音読セクション</h2><p>和訳を確認し、太字の表現に注目して英文を音読しましょう。</p>'+data.filter(q=>q.s<4).map(q=>'<section style="border-bottom:1px solid #b8d6e4;padding:18px 0"><h3>'+groups[q.s]+' · '+q.n+'</h3><p>'+esc(q.j)+'</p><p>'+esc(q.t).replace(/\{([^}]+)\}/g,(_,s)=>'<strong>'+s.split(' ').map(w=>w.split('|')[0]).join(' ')+'</strong>')+'</p><button data-read="'+data.indexOf(q)+'">🔊 英文を聞く</button></section>').join('')+'<p><button id="stopReading">読み上げ停止</button></p><button id="readingDone">音読できた → G1問題へ</button>';document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>say(full(data[Number(b.dataset.read)])));$('stopReading').onclick=()=>window.speechSynthesis&&speechSynthesis.cancel();$('readingDone').onclick=()=>{readingDone=true;start(0)};}
const oldStart=start;start=function(s){if(window.speechSynthesis)speechSynthesis.cancel();oldStart(s)};
finish=function(){if(done.size!==data.length){$('card').innerHTML='<h2>残りの問題にも挑戦しよう</h2><p>上のボタンから選べます。</p>';return}if(!readingDone){$('card').innerHTML='<h2>問題は全問クリア！</h2><p>最後に音読セクションを完了させよう。</p><button id="backReading">音読へ</button>';$('backReading').onclick=reading;return}$('card').innerHTML=`<div style="text-align:center"><div style="font-size:100px" aria-label="かわいいサメ">🦈✨</div><h2>ご褒美タイムだ〜</h2><p>よくがんばったね！ 全${data.length}問クリア！</p><button id="sharkVoice">🔊 サメの声を聞く</button></div><div style="margin-top:24px"><iframe title="ご褒美の動画" style="width:100%;aspect-ratio:16/9;border:0" src="https://www.youtube.com/embed/JKZqmwToJdo" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><p><a href="https://www.youtube.com/watch?v=JKZqmwToJdo" target="_blank" rel="noopener">動画が再生できない場合はYouTubeで見る</a></p></div><h3>先生へ完了報告</h3><label>名前 <input id="reportName" autocomplete="name" style="width:70%"></label><p><button id="report">終わったら報告する</button></p><p class="muted">1216ssence@gmail.com宛てのメール作成画面が開きます。内容を確認して送信してください。</p>`;$('sharkVoice').onclick=()=>say('ご褒美タイムだ〜','ja-JP');say('ご褒美タイムだ〜','ja-JP');$('report').onclick=()=>{const name=$('reportName').value.trim();if(!name){alert('名前を入力してください。');return}const body=name+'です。\nLesson 5 Grammarの音読、G1、G2、Ex1、Ex2、プリント問題をすべて終えました。\n全'+data.length+'問を復習まで完了しました。\n復習回数：'+mistakes+'回\n※プリントの日本語問題は解答例と照合して自己採点しました。';location.href='mailto:1216ssence@gmail.com?subject='+encodeURIComponent('Lesson 5 Grammar 完了報告')+'&body='+encodeURIComponent(body)}};
$('nav').innerHTML='<button onclick="reading()">音読</button>'+groups.map((s,i)=>`<button onclick="start(${i})">${s}</button>`).join('')+'<button onclick="finish()">完了・ご褒美</button>';document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#english')){e.preventDefault();check()}});progress();reading();
</script></html>
