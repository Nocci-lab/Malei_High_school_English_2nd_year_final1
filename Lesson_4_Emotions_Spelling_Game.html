<body>
  <div class="bg-emoji e1">😄</div><div class="bg-emoji e2">🤩</div><div class="bg-emoji e3">🥰</div><div class="bg-emoji e4">😁</div>
  <main class="app">
    <header><p class="eyebrow">Lesson 4 · Spelling Challenge</p><h1>Can You Feel Emotions in Text?</h1><p class="sub">日本語と頭文字をヒントに、英語を完成させよう！</p></header>
    <nav class="road" id="stageRoad" aria-label="ステージ進行状況"></nav>
    <section class="card game" id="gameScreen">

      <p class="label">日本語の意味</p><p class="meaning" id="meaning"></p><div class="hint" id="hint"></div>

    </section>

      <div class="praise">よくがんばったね〜！</div>
      <div class="faces"><div class="face"><span>😀</span><b>すごい！</b></div><div class="face"><span>😄</span><b>さすが！</b></div><div class="face"><span>😁</span><b>完璧！</b></div><div class="face"><span>😊</span><b>最高！</b></div><div class="face"><span>🤩</span><b>よくできた！</b></div><div class="face"><span>🥰</span><b>ナイス！</b></div><div class="face"><span>😺</span><b>がんばった！</b></div><div class="face"><span>🥳</span><b>えらい！</b></div></div>
      <section class="review"><h3>📝 最後の要チェック</h3><p class="review-summary" id="reviewSummary"></p><div class="review-list" id="reviewList"></div></section>
      <div class="finish-actions"><button class="primary" id="playAgainBtn" type="button">もう一度チャレンジ</button><a class="link" href="Lesson_4_Emotions_4Choice_Game.html">4択ゲームに戻る</a></div>
    </section>
    <div class="tools"><button class="reset" id="resetBtn" type="button">はじめからやり直す</button></div>
  </main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"><canvas id="confetti"></canvas><div class="modal"><div class="big">🎉</div><h2>やったね！</h2><p id="celebrateMessage"></p><button class="primary" id="continueBtn" type="button"></button></div></div>
  <script>
    "use strict";
    const stages=[
      {name:"Stage 1　気持ちを伝えよう",words:[["emoticon","顔文字"],["emoji","絵文字"],["facial","顔の、表情の"],["misunderstanding","誤解"],["expand","広げる、拡大する"],["engaged","従事して、関わって"],["digital","デジタルの"],["subtle","微妙な、かすかな"],["nuance","ニュアンス、微妙な差"],["firstly","第一に"],["horizontal","横向きの、水平の"],["vertical","縦向きの、垂直の"],["analyze","分析する"],["tweet","ツイート、短文投稿"],["chart","図表、グラフ"]]},
      {name:"Stage 2　文化の違い",words:[["overwhelmingly","圧倒的に"],["actively","活発に、積極的に"],["interestingly","興味深いことに"],["Singapore","シンガポール"],["commonly","一般に、よく"],["secondly","第二に"],["shyness","恥ずかしさ"],["confusion","混乱、困惑"],["alien","なじみのない、異質な"],["thirdly","第三に"],["interpret","解釈する、読み取る"],["investigate","調査する"],["participant","参加者"],["evaluate","評価する"],["tend","～する傾向がある"]]},
      {name:"Stage 3　表情を読み取ろう",words:[["unlike","～と違って"],["lastly","最後に"],["Cameroon","カメルーン"],["Tanzania","タンザニア"],["sadness","悲しさ"],["utterly","まったく、完全に"],["baffled","当惑した"],["indicate","示す"],["universal","世界共通の、普遍的な"],["usage","使用法、用法"],["perceive","知覚する、捉える"],["entirely","完全に、すっかり"],["logically","論理的に"],["be engaged in","～に従事している、～に関わっている"],["be divided into","～に分けられる"]]},
      {name:"Stage 4　会話と表現",words:[["in other words","言い換えれば、つまり"],["by no means","決して～ない"],["in the first place","そもそも、第一に"],["What do you mean","どういう意味ですか"],["I've been wondering what you meant","あなたがどういう意味で言ったのか気になっています"],["Are you saying","～と言っているのですか"],["Where did you learn that","それをどこで知ったのですか"],["Who told you that","誰がそう言ったのですか"],["What made you think so","どうしてそう思ったのですか"],["visual","視覚の"],["grin","にっこり笑う"],["frown","しかめ面をする"],["embarrassed","恥ずかしい、当惑した"],["blush","赤面する"],["tease","からかう"]]},
      {name:"Stage 5　笑顔でゴール",words:[["affection","愛情"],["devilish","小悪魔のような"],["wicked","いたずらな、邪悪な"],["confident","自信のある"],["skeptical","疑い深い、懐疑的な"],["doubtful","疑わしい"],["hug","抱擁、抱きしめること"],["dressed with","～で和えた"],["season with","～で味つけする"],["wrap A in B","AをBで包む"],["top A with B","AにBをのせる"],["sprinkle A with B","AにBを散らす"],["dip A in B","AをBに浸す"],["serve A in a bowl","Aを丼で出す"],["roasted seaweed","焼き海苔"]]}
    ].map((s,si)=>({...s,words:s.words.map((w,wi)=>({answer:w[0],meaning:w[1],id:`${si}-${wi}`}))}));
    const $=id=>document.getElementById(id),el={road:$("stageRoad"),stage:$("stageName"),counter:$("counter"),count:$("masteredCount"),meaning:$("meaning"),hint:$("hint"),input:$("answerInput"),check:$("checkBtn"),feedback:$("feedback"),feedbackText:$("feedbackText"),next:$("nextBtn"),bar:$("progressBar"),overlay:$("overlay"),message:$("celebrateMessage"),continue:$("continueBtn"),game:$("gameScreen"),finish:$("finishScreen"),reviewSummary:$("reviewSummary"),reviewList:$("reviewList"),playAgain:$("playAgainBtn"),reset:$("resetBtn"),confetti:$("confetti")};
    const KEY="lesson4-emotions-spelling-v1";let stageIndex=0,queue=[],current=null,mastered=new Set(),mistakes={},locked=false,qNo=0,confettiId=null;
    function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function norm(v){return v.normalize("NFKC").trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[‐‑‒–—−]/g,"-").replace(/[.?!…]+$/g,"").replace(/\s+/g," ")}
    function esc(v){return v.replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}
    function hint(v){return v.split(" ").map((w,i)=>{let first=false;return [...w].map(c=>{if(/[A-Za-z]/.test(c)){if(i===0&&!first){first=true;return c.toLowerCase()}return"_"}return c}).join("")}).join("  ")}
    function focusInput(){setTimeout(()=>{try{el.input.focus({preventScroll:true})}catch(_){el.input.focus()}},50)}
    function save(done=false){localStorage.setItem(KEY,JSON.stringify({stageIndex:Math.min(stageIndex,4),mastered:[...mastered],mistakes,done}))}
    function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||"null");if(!s)return;mistakes=s.mistakes||{};if(s.done){stageIndex=5;showFinish(false);return}if(Number.isInteger(s.stageIndex)&&s.stageIndex>=0&&s.stageIndex<5){stageIndex=s.stageIndex;mastered=new Set((s.mastered||[]).filter(id=>stages[stageIndex].words.some(w=>w.id===id)))}}catch(_){localStorage.removeItem(KEY)}}
    function road(){el.road.innerHTML=stages.map((_,i)=>`<div class="pill ${i<stageIndex?"done":i===stageIndex?"active":""}">Stage ${i<stageIndex?"✓":i+1}</div>`).join("")}
    function start(keep=true){if(!keep)mastered=new Set();queue=shuffle(stages[stageIndex].words.filter(w=>!mastered.has(w.id)));qNo=mastered.size;road();queue.length?nextQuestion():completeStage()}
    function nextQuestion(){locked=false;current=queue.shift();qNo++;let s=stages[stageIndex];el.stage.textContent=s.name;el.counter.textContent=`問題 ${qNo}（残り ${s.words.length-mastered.size}項目）`;el.count.textContent=`${mastered.size} / ${s.words.length}`;el.meaning.textContent=current.meaning;el.hint.textContent=hint(current.answer);el.input.value="";el.input.disabled=false;el.input.className="";el.check.disabled=false;el.feedback.className="feedback";el.feedbackText.innerHTML="";el.bar.style.width=`${mastered.size/s.words.length*100}%`;focusInput()}
    function check(){if(locked){advance();return}if(!el.input.value.trim()){focusInput();return}locked=true;let ok=norm(el.input.value)===norm(current.answer);el.input.disabled=true;el.check.disabled=true;el.feedback.classList.add("show");if(ok){mastered.add(current.id);el.input.classList.add("correct");el.feedback.classList.add("good");el.feedbackText.innerHTML=`<strong>正解！ ✨ ${esc(current.answer)}</strong><small>${esc(current.meaning)}</small>`;el.bar.style.width=`${mastered.size/stages[stageIndex].words.length*100}%`}else{queue.push(current);mistakes[current.id]=(mistakes[current.id]||0)+1;el.input.classList.add("wrong");el.feedback.classList.add("try");el.feedbackText.innerHTML=`<strong>おしい！ 正解は “${esc(current.answer)}”</strong><small>あとでもう一度出てくるよ。</small>`}save();el.count.textContent=`${mastered.size} / ${stages[stageIndex].words.length}`}
    function advance(){if(!locked)return;mastered.size===stages[stageIndex].words.length?completeStage():nextQuestion()}
    function completeStage(){let last=stageIndex===4;el.message.textContent=last?"最後の15項目も全問正解！ 笑顔のみんなが待っています。":`15項目を全部マスターしました。ひと休みしたら、次のステージへ進もう！`;el.continue.textContent=last?"笑顔のみんなに会う！ 😊":"次のステージへ";el.overlay.classList.add("show");confetti();}
    function continueStage(){stopConfetti();el.overlay.classList.remove("show");if(stageIndex===4){stageIndex=5;mastered=new Set();save(true);showFinish(true)}else{stageIndex++;mastered=new Set();save();start(false)}}
    function renderReview(){let map=new Map(stages.flatMap(s=>s.words).map(w=>[w.id,w])),r=Object.entries(mistakes).filter(([id,n])=>map.has(id)&&n>0).map(([id,n])=>({...map.get(id),n})).sort((a,b)=>b.n-a.n);if(!r.length){el.reviewSummary.textContent="今回の記録では、確認が必要な項目はありません。";el.reviewList.innerHTML='<div class="perfect">🌟 全75項目、一発正解！ パーフェクト！</div>';return}el.reviewSummary.textContent=`一度でも間違えた${r.length}項目です。上にあるほど要チェック！`;el.reviewList.innerHTML=r.map(w=>`<div class="review-item"><div class="review-word">${esc(w.answer)}</div><div class="review-meaning">${esc(w.meaning)}</div><div class="badge ${w.n>=2?"priority":""}">${w.n>=2?"⚠ ":""}${w.n}回</div></div>`).join("")}
    function showFinish(burst=true){el.game.classList.add("hidden");el.finish.classList.add("show");renderReview();road();[...el.road.children].forEach(x=>{x.className="pill done";x.textContent="Stage ✓"});if(burst)confetti(4500,true)}
    function reset(){if(!confirm("記録を消してStage 1からやり直しますか？"))return;localStorage.removeItem(KEY);stopConfetti();stageIndex=0;mastered=new Set();mistakes={};el.overlay.classList.remove("show");el.finish.classList.remove("show");el.game.classList.remove("hidden");start(false)}
    function confetti(ms=3200,front=false){stopConfetti();let c=el.confetti;if(front){document.body.appendChild(c);c.style.zIndex="20"}else{el.overlay.prepend(c);c.style.zIndex="1"}let x=c.getContext("2d"),d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.scale(d,d);let colors=["#ffd966","#db4f83","#8f65c2","#48b9dd","#55c990","#fff"],p=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.8,w:6+Math.random()*8,h:8+Math.random()*11,c:colors[Math.floor(Math.random()*colors.length)],s:2.5+Math.random()*4,r:Math.random()*6,d:-1.6+Math.random()*3.2})),t=performance.now();function f(n){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(a=>{a.y+=a.s;a.x+=a.d;a.r+=.09;if(a.y>innerHeight+20)a.y=-20;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=a.c;x.fillRect(-a.w/2,-a.h/2,a.w,a.h);x.restore()});n-t<ms?confettiId=requestAnimationFrame(f):stopConfetti()}confettiId=requestAnimationFrame(f)}
    function stopConfetti(){if(confettiId)cancelAnimationFrame(confettiId);confettiId=null;let x=el.confetti.getContext("2d");x.clearRect(0,0,el.confetti.width,el.confetti.height)}
    el.check.addEventListener("click",check);el.next.addEventListener("click",advance);el.input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();locked?advance():check()}});el.continue.addEventListener("click",continueStage);el.reset.addEventListener("click",reset);el.playAgain.addEventListener("click",reset);load();if(stageIndex<5)start(true);
  </script>
