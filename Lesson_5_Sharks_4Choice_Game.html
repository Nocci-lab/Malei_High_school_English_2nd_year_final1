<script>

const stages=[
{name:"Stage 1　海へ出発",words:[["shark","サメ"],["journal","専門誌、定期刊行物"],["mass","大衆の、大量の"],["sensationally","扇情的に、大げさに"],["statistically","統計的に"],["environmentalist","環境保護活動家"],["Jaws","『ジョーズ』（映画名）"],["terrorize","恐怖に陥れる"],["resort","行楽地、リゾート地"],["presence","存在、登場"],["accompany","～に伴う、添える"],["ominous","不吉な"],["documentary","ドキュメンタリー、記録映画"],["perception","認識、見方"],["willingness","意欲、進んでしようとする気持ち"],["determine","確かめる、決定する"],["split","分ける、分割する"]]},

{name:"Stage 3　音と感じ方",words:[["ruin","台なしにする、損なう"],["mislead","誤解させる、惑わせる"],["consumer","消費者"],["up-tempo","テンポの速い"],["beverage","飲み物、飲料"],["cognition","認知、認知機能"],["headphone","ヘッドホン"],["concentration","集中、集中力"],["moderate","適度な、中程度の"],["enhance","高める、向上させる"],["promote","促進する"],["decibel","デシベル（音量の単位）"],["particularly","特に"],["saltiness","塩味"],["sweetness","甘味"],["dull","鈍い、鈍らせる"]]},
{name:"Stage 4　味と熟語",words:[["sensitivity","感度、敏感さ"],["crunchiness","カリカリした食感"],["unappetizing","食欲をそそらない"],["bass","低音"],["hum","ブーンという低い音"],["salty","塩辛い"],["sugary","砂糖のように甘い"],["crunchy","カリカリした"],["texture","食感、手触り"],["become rooted in","～に根づく、定着する"],["be likely to do","～しそうである、～する可能性が高い"],["be aware of","～を意識している、～に気づいている"],["in turn","今度は、順番に、その結果"],["throughout the ages","昔からずっと、あらゆる時代を通じて"],["in large part","大部分は"],["consist of","～から成る"]]},
{name:"Stage 5　サメとゴール",words:[["gain support for","～への支持を得る"],["have an influence on","～に影響を与える"],["split A into B","AをBに分ける"],["without any sound","まったく音なしで"],["seem to indicate","～を示しているように思われる"],["be combined","組み合わされる"],["be set up to do","～するために設定される"],["regarding","～に関して"],["in regard to","～に関して"],["vote for","～に投票する"],["as follows","次のとおり"],["have implications for","～に重要な意味・影響を持つ"],["be viewed as","～とみなされる"],["primary source","主な情報源"],["be careful not to do","～しないよう注意する"],["be misled by","～に惑わされる、誤解させられる"]]}
].map((s,si)=>({...s,words:s.words.map((w,wi)=>({answer:w[0],meaning:w[1],id:`${si}-${wi}`}))}));
const $=id=>document.getElementById(id),el={road:$("stageRoad"),stage:$("stageName"),counter:$("counter"),timer:$("timer"),timerBar:$("timerBar"),direction:$("direction"),prompt:$("prompt"),choices:$("choices"),feedback:$("feedback"),masterBar:$("masterBar"),overlay:$("overlay"),icon:$("modalIcon"),title:$("modalTitle"),message:$("modalMessage"),modalButton:$("modalButton"),confetti:$("confetti"),game:$("gameScreen"),finish:$("finishScreen"),review:$("reviewNote"),playAgain:$("playAgainBtn"),reset:$("resetBtn")};
let stageIndex=0,queue=[],current=null,mastered=new Set(),mistakes={},qNo=0,direction="ja-en",active=false,locked=false,deadline=0,timerId=null,nextId=null,action="start",confettiId=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(v){return v.replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}function save(done=false){localStorage.setItem(KEY,JSON.stringify({stageIndex:Math.min(stageIndex,4),mistakes,done}))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||"null");if(!s)return;mistakes=s.mistakes||{};if(s.done){stageIndex=5;showFinish(false);return}if(Number.isInteger(s.stageIndex)&&s.stageIndex>=0&&s.stageIndex<5)stageIndex=s.stageIndex}catch(_){localStorage.removeItem(KEY)}}
function road(){el.road.innerHTML=stages.map((_,i)=>`<div class="pill ${i<stageIndex?"done":i===stageIndex?"active":""}">Stage ${i<stageIndex?"✓":i+1}</div>`).join("")}function idle(){let s=stages[stageIndex];el.stage.textContent=s.name;el.counter.textContent=`マスター 0 / ${s.words.length}`;el.timer.textContent="2:30";el.timer.classList.remove("urgent");el.timerBar.classList.remove("urgent");el.timerBar.style.width="100%";el.direction.textContent="ランダム出題";el.prompt.textContent="スタートボタンを押してください";el.choices.innerHTML="";el.feedback.className="feedback";el.feedback.textContent="日本語→英語／英語→日本語がランダムで出ます。";el.masterBar.style.width="0"}function startModal(){road();el.icon.textContent="⏱️🦈";el.title.textContent=`Stage ${stageIndex+1}`;el.message.textContent=`${stages[stageIndex].words.length}項目を2分30秒以内にマスターしよう。準備ができたらスタート！`;el.modalButton.textContent="スタート！";action="start";el.overlay.classList.add("show")}

function choose(selected){if(!active||locked)return;locked=true;let ok=selected.dataset.id===current.id,n=stages[stageIndex].words.length;el.choices.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.dataset.id===current.id){b.classList.add("correct");b.querySelector(".key").textContent="✓"}});if(ok){mastered.add(current.id);el.feedback.className="feedback good";el.feedback.textContent=`正解！ ${current.answer} ＝ ${current.meaning}`}else{selected.classList.add("wrong");selected.querySelector(".key").textContent="✕";mistakes[current.id]=(mistakes[current.id]||0)+1;queue.push(current);save();el.feedback.className="feedback try";el.feedback.textContent=`おしい！ ${current.answer} ＝ ${current.meaning}　あとでもう一度！`}el.counter.textContent=`マスター ${mastered.size} / ${n}　出題 ${qNo}`;el.masterBar.style.width=`${mastered.size/n*100}%`;nextId=setTimeout(()=>{if(!active)return;mastered.size===n?completeStage():nextQuestion()},ok?600:1150)}function tick(){if(!active)return;let left=Math.max(0,deadline-Date.now()),sec=Math.ceil(left/1000);el.timer.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;el.timerBar.style.width=`${left/LIMIT*100}%`;let urgent=left<=30000;el.timer.classList.toggle("urgent",urgent);el.timerBar.classList.toggle("urgent",urgent);if(left<=0)timeUp()}function stop(){active=false;locked=true;clearInterval(timerId);clearTimeout(nextId);timerId=null;nextId=null}
function timeUp(){stop();el.choices.querySelectorAll(".choice").forEach(b=>b.disabled=true);el.icon.textContent="⌛🦈";el.title.textContent="タイムアップ！";el.message.textContent=`${mastered.size} / ${stages[stageIndex].words.length}項目までマスターできました。ひと休みして同じ海域へ再挑戦！`;el.modalButton.textContent="もう一度スタート";action="retry";el.overlay.classList.add("show")}function completeStage(){let elapsed=LIMIT-Math.max(0,deadline-Date.now());stop();let sec=Math.round(elapsed/1000),time=`${Math.floor(sec/60)}分${String(sec%60).padStart(2,"0")}秒`,last=stageIndex===4,n=stages[stageIndex].words.length;el.icon.textContent="🦈🎉";el.title.textContent="やったね！";el.message.textContent=`${n}項目を${time}でクリア！ ${last?"手を振るサメが待っています。":"次の海域もこの調子！"}`;el.modalButton.textContent=last?"サメに会いに行く！ 🦈":"次のステージへ";action=last?"finish":"next";el.overlay.classList.add("show");confetti();save()}
function handleModal(){if(action==="start"||action==="retry"){startStage();return}if(action==="next"){stopConfetti();stageIndex++;save();idle();startModal();return}if(action==="finish"){stopConfetti();stageIndex=5;save(true);el.overlay.classList.remove("show");showFinish(true)}}function showFinish(burst=true){stop();el.overlay.classList.remove("show");el.game.classList.add("hidden");el.finish.classList.add("show");road();[...el.road.children].forEach(x=>{x.className="pill done";x.textContent="Stage ✓"});let all=stages.flatMap(s=>s.words),r=all.filter(w=>mistakes[w.id]>0).sort((a,b)=>(mistakes[b.id]||0)-(mistakes[a.id]||0));el.review.textContent=r.length?`4択で要チェックだった項目：${r.slice(0,9).map(w=>`${w.answer}（${mistakes[w.id]}回）`).join("、")}${r.length>9?` ほか${r.length-9}項目`:""}`:"4択は全問一発正解！ そのままスペリングゲームへ進もう！";if(burst)confetti(4400,true)}function reset(){if(!confirm("記録を消してStage 1からやり直しますか？"))return;localStorage.removeItem(KEY);stop();stopConfetti();stageIndex=0;mistakes={};el.finish.classList.remove("show");el.game.classList.remove("hidden");idle();startModal()}
function confetti(ms=3200,front=false){stopConfetti();let c=el.confetti;if(front){document.body.appendChild(c);c.style.zIndex="20"}else{el.overlay.prepend(c);c.style.zIndex="1"}let x=c.getContext("2d"),d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.scale(d,d);let colors=["#ffe29a","#27c3ca","#168db5","#55c990","#f2798b","#fff"],p=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.8,w:6+Math.random()*8,h:8+Math.random()*11,c:colors[Math.floor(Math.random()*colors.length)],s:2.5+Math.random()*4,r:Math.random()*6,d:-1.6+Math.random()*3.2})),t=performance.now();function f(n){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(a=>{a.y+=a.s;a.x+=a.d;a.r+=.09;if(a.y>innerHeight+20)a.y=-20;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=a.c;x.fillRect(-a.w/2,-a.h/2,a.w,a.h);x.restore()});n-t<ms?confettiId=requestAnimationFrame(f):stopConfetti()}confettiId=requestAnimationFrame(f)}function stopConfetti(){if(confettiId)cancelAnimationFrame(confettiId);confettiId=null;let x=el.confetti.getContext("2d");x.clearRect(0,0,el.confetti.width,el.confetti.height)}
el.modalButton.addEventListener("click",handleModal);el.reset.addEventListener("click",reset);el.playAgain.addEventListener("click",reset);document.addEventListener("keydown",e=>{if(!active||locked||e.target.tagName==="BUTTON")return;let n=Number(e.key),b=el.choices.children[n-1];if(n>=1&&n<=4&&b)choose(b)});load();if(stageIndex<5){idle();startModal()}
</script></body></html>
