.tip{margin:18px 0 0;padding:12px 14px;border-left:5px solid var(--gold);background:#fff6d9;border-radius:0 12px 12px 0;color:#5d4b19}.reward{display:none;position:fixed;inset:0;z-index:20;background:rgba(8,26,43,.84);padding:18px;overflow:auto}.reward.show{display:grid;place-items:center}.reward-card{width:min(940px,96vw);background:linear-gradient(150deg,#fffdf0,#dff7ff);border-radius:30px;padding:30px 20px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.35);position:relative;overflow:hidden}.reward-card h2{font-size:clamp(30px,6vw,58px);line-height:1.2;margin:8px auto;color:#b32d43;text-shadow:0 3px #fff}.reward-card p{font-weight:900;font-size:21px}.team{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2.5vw,24px);min-height:250px;margin:20px 0}.ranger{--c:#e54848;position:relative;width:120px;height:210px;animation:cheer .72s infinite alternate ease-in-out;transform-origin:50% 100%}.ranger:nth-child(2){--c:#3487db;animation-delay:-.15s}.ranger:nth-child(3){--c:#f2c744;animation-delay:-.3s}.ranger:nth-child(4){--c:#3da868;animation-delay:-.45s}.ranger:nth-child(5){--c:#e96ca6;animation-delay:-.6s}.head{position:absolute;left:31px;top:8px;width:58px;height:58px;border-radius:50%;background:#f2c49d;border:5px solid var(--c);z-index:3}.visor{position:absolute;left:6px;top:11px;width:36px;height:15px;background:#18334c;border-radius:10px 10px 16px 16px}.mouth{position:absolute;left:20px;top:35px;width:15px;height:8px;border-bottom:3px solid #773c3c;border-radius:50%}.body{position:absolute;left:28px;top:58px;width:65px;height:82px;background:var(--c);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.badge{position:absolute;left:52px;top:78px;color:#fff;font-weight:1000;z-index:4}.arm{position:absolute;top:69px;width:20px;height:76px;background:var(--c);border-radius:12px;transform-origin:10px 9px}.arm.l{left:18px;transform:rotate(38deg)}.arm.r{right:17px;transform:rotate(-38deg)}.leg{position:absolute;top:132px;width:23px;height:75px;background:var(--c);border-radius:0 0 12px 12px}.leg.l{left:34px;transform:rotate(5deg)}.leg.r{right:34px;transform:rotate(-5deg)}
.team.l3 .bike{display:block}.bike{display:none;position:absolute;left:2px;bottom:0;width:116px;height:58px;border-bottom:7px solid #343c43}.bike:before,.bike:after{content:"";position:absolute;bottom:-15px;width:41px;height:41px;border:6px solid #343c43;border-radius:50%;background:transparent}.bike:before{left:2px}.bike:after{right:2px}.team.l3 .ranger{height:240px}.team.l4 .ranger:nth-child(1) .mouth{height:12px;border:3px solid #773c3c;border-top:0}.team.l4 .ranger:nth-child(2) .mouth{border:0;border-top:3px solid #773c3c}.team.l4 .ranger:nth-child(3) .mouth{height:13px;border:3px solid #773c3c;background:#7a3131}.team.l4 .ranger:nth-child(4) .visor{transform:rotate(7deg)}.team.l4 .ranger:nth-child(5) .mouth{width:8px;height:8px;border:3px solid #773c3c;border-radius:50%}.team.l5 .head{border-width:12px;border-color:#6fb8c7}.team.l5 .head:before{content:"";position:absolute;left:14px;top:-30px;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:30px solid #6fb8c7}.team.l5 .head:after{content:"";position:absolute;left:-9px;top:33px;width:52px;height:18px;border-bottom:7px solid #fff;clip-path:polygon(0 0,10% 100%,20% 0,30% 100%,40% 0,50% 100%,60% 0,70% 100%,80% 0,90% 100%,100% 0)}
.mail-btn,.close-reward{border:0;border-radius:16px;padding:13px 20px;font-weight:900;margin:6px}.mail-btn{background:#c43d4b;color:white;box-shadow:0 6px 0 #8e2430}.close-reward{background:#dbe6ec;color:#29475d}.confetti{position:absolute;top:-30px;width:10px;height:22px;animation:fall 3.4s linear infinite;opacity:.9}@keyframes fall{to{transform:translateY(760px) rotate(850deg)}}@keyframes cheer{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-16px) rotate(1deg)}}
@media(max-width:700px){body{font-size:16px}.toolbar{grid-template-columns:1fr}.lesson-picker{grid-template-columns:1fr}.game{padding:16px}.question{padding:17px}.answer-row{flex-direction:column}.team{gap:0;transform:scale(.72);margin:-10px -90px;min-width:650px}.reward-card{overflow:hidden}.ranger{width:110px}.progress-wrap{min-width:100%}}

<body>
<main class="app">
  <section class="hero">
    <div class="eyebrow">HEARTENING WORKBOOK</div>
    <h1>Lesson 3〜5 問題ゲーム</h1>
    <p>全文ではなく、<b>【　】に入る答えだけ</b>をタイプします。チェック後は、正解・不正解にかかわらず解説が出ます。</p>
    <div class="toolbar">
      <div class="namebox"><label for="studentName">名前</label><input id="studentName" value="稀衣" autocomplete="name"></div>
      <button class="pdf-btn" type="button" id="pdfBtn">📕 答えPDFを開く</button>
    </div>
  </section>

  <section class="lesson-picker" aria-label="Lessonを選ぶ">
    <button class="lesson-btn" data-lesson="3" type="button">🚲 Lesson 3<small>The World's Most Bicycle-friendly City</small></button>
    <button class="lesson-btn" data-lesson="4" type="button">😊 Lesson 4<small>Can You Feel Emotions in Text?</small></button>
    <button class="lesson-btn" data-lesson="5" type="button">🦈 Lesson 5<small>Background Music and Sharks</small></button>
  </section>

  <section id="game" class="game" aria-live="polite">
    <div class="game-top">
      <h2 class="game-title" id="gameTitle"></h2>
      <div class="progress-wrap"><div class="progress-label"><span>正解した問題</span><span id="progressText"></span></div><div class="track"><div class="bar" id="progressBar"></div></div></div>
    </div>
    <div><span class="section-tag" id="sectionTag"></span><span class="counter" id="counter"></span></div>
    <article class="question" id="questionCard">
      <div class="jp" id="jp"></div>
      <div class="sentence" id="sentence"></div>
      <div class="answer-row"><input id="answerInput" spellcheck="false" autocomplete="off" aria-label="答え"><button class="check" id="checkBtn" type="button">チェック</button></div>
      <div class="feedback" id="feedback"></div>
    </article>
    <div class="nav"><button class="prev" id="prevBtn" type="button">← 前の問題</button><button class="reset" id="resetBtn" type="button">このLessonを最初から</button><button class="next" id="nextBtn" type="button">次の問題 →</button></div>
    <div class="tip">※ 間違えたときは、解説を確認してから同じ欄にもう一度入力してください。途中の進み具合はこの端末に保存されます。</div>
  </section>
</main>

<section class="reward" id="reward" aria-modal="true" role="dialog">
  <div class="reward-card" id="rewardCard">
    <div class="eyebrow">LESSON COMPLETE!</div>
    <h2>期末試験に向けて<br>大前進だ！やったー！</h2>
    <p id="rewardLine"></p>
    <div class="team" id="team"></div>
    <div><button class="mail-btn" id="mailBtn" type="button">✉️ 先生に完了報告メールを開く</button><button class="close-reward" id="closeReward" type="button">画面を閉じる</button></div>
  </div>
</section>

{"id":"3-1-i2","part":"Part 1","cat":"Idioms & Expressions","jp":"最近何の運動もしていないので、私は体がなまっている。","q":"I'm 【　】 because I haven't been exercising recently.","answers":["out of shape"],"display":"out of shape","why":"out of shape は「運動不足で、体がなまって」。"},
{"id":"3-1-g1","part":"Part 1","cat":"Grammar G2","jp":"ローラはいつもコーヒーを避ける。だから、彼女はコーヒーが好きではないと思うのももっともだ。","q":"Laura always avoids coffee. So you 【　】 think she doesn't like coffee.","answers":["may well"],"display":"may well","why":"may well + 動詞の原形で「〜するのももっともだ」。"},

{"id":"3-1-g3","part":"Part 1","cat":"Grammar G2","jp":"兄は以前サンフランシスコに住んでいた。今はヒューストンに住んでいる。","q":"My brother 【　】 live in San Francisco. He lives in Houston now.","answers":["used to"],"display":"used to","why":"used to + 動詞の原形で「以前は〜したものだった」。"},
{"id":"3-1-g4","part":"Part 1","cat":"Grammar G2","jp":"私は家で映画を見るより、むしろ映画館に行きたい。","q":"I 【　】 go to a theater than watch a movie at home.","answers":["would rather","'d rather","d rather"],"display":"would rather","why":"would rather A than B で「BするよりむしろAしたい」。"},
{"id":"3-1-g5","part":"Part 1","cat":"Grammar G2","jp":"以前は毎日ギターを弾いていましたが、今は弾いていません。","q":"I 【　】 every day, but now I don't.","answers":["used to play the guitar"],"display":"used to play the guitar","why":"過去の習慣は used to + 動詞の原形で表します。"},
{"id":"3-1-g6","part":"Part 1","cat":"Grammar G2","jp":"中華料理より、むしろ寿司を食べたいです。","q":"Sorry, I 【　】 than Chinese food.","answers":["would rather eat sushi","'d rather eat sushi","d rather eat sushi"],"display":"would rather eat sushi","why":"would rather eat sushi than Chinese food の形です。"},

<script>
const LESSONS=JSON.parse(document.getElementById('question-data').textContent);
const TITLES={3:"The World's Most Bicycle-friendly City",4:"Can You Feel Emotions in Text?",5:"Background Music and Sharks"};
let currentLesson=null,currentIndex=0,attempts={};
const $=id=>document.getElementById(id),game=$('game'),input=$('answerInput'),feedback=$('feedback');
function keyFor(n){return `heartening-workbook-${n}`}
function state(n){try{return JSON.parse(localStorage.getItem(keyFor(n)))||{done:{},index:0,attempts:{}}}catch{return{done:{},index:0,attempts:{}}}}
function save(){if(!currentLesson)return;localStorage.setItem(keyFor(currentLesson),JSON.stringify({done:doneMap(),index:currentIndex,attempts}))}
function doneMap(){const s=state(currentLesson);return window._done||s.done||{}}
function normalize(v){return v.toLowerCase().trim().replace(/[“”"']/g,'').replace(/[.,!?]/g,'').replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ')}
function isRight(q,v){const n=normalize(v);return q.answers.some(a=>normalize(a)===n)}
function selectLesson(n){currentLesson=String(n);const s=state(currentLesson);window._done=s.done||{};attempts=s.attempts||{};currentIndex=Math.min(s.index||0,LESSONS[currentLesson].length-1);document.querySelectorAll('.lesson-btn').forEach(b=>b.classList.toggle('active',b.dataset.lesson===currentLesson));game.classList.add('show');render();game.scrollIntoView({block:'start'})}
function render(){const list=LESSONS[currentLesson],q=list[currentIndex],done=doneMap();$('gameTitle').textContent=`Lesson ${currentLesson}｜${TITLES[currentLesson]}`;$('sectionTag').textContent=`${q.part}　${q.cat}`;$('counter').textContent=`${currentIndex+1} / ${list.length}`;$('jp').textContent=q.jp;$('sentence').innerHTML=q.q.replace(/【[^】]+】/g,m=>`<span class="blank">${m}</span>`);input.value='';input.disabled=false;$('checkBtn').disabled=false;feedback.className='feedback';feedback.innerHTML='';$('prevBtn').disabled=currentIndex===0;$('nextBtn').disabled=!done[q.id];updateProgress();setTimeout(()=>input.focus({preventScroll:true}),30)}
function updateProgress(){const list=LESSONS[currentLesson],done=doneMap(),count=list.filter(q=>done[q.id]).length;$('progressText').textContent=`${count} / ${list.length}`;$('progressBar').style.width=`${count/list.length*100}%`}
function check(){const q=LESSONS[currentLesson][currentIndex],v=input.value;if(!v.trim()){feedback.className='feedback show wrong';feedback.innerHTML='<strong>答えを入力してね。</strong>';return}attempts[q.id]=(attempts[q.id]||0)+1;const ok=isRight(q,v);feedback.className=`feedback show ${ok?'correct':'wrong'}`;feedback.innerHTML=`<strong>${ok?'✅ 正解！':'❌ もう一度！'}</strong><br><span class="answer-reveal">答え：${q.display}</span><br>${q.why}`;if(ok){window._done[q.id]=true;$('nextBtn').disabled=false;input.disabled=true;$('checkBtn').disabled=true;updateProgress();save();if(LESSONS[currentLesson].every(x=>window._done[x.id]))setTimeout(showReward,550)}else{save();input.select()}}
function move(delta){const list=LESSONS[currentLesson];currentIndex=Math.max(0,Math.min(list.length-1,currentIndex+delta));save();render()}
function makeTeam(){const team=$('team');team.className=`team l${currentLesson}`;team.innerHTML='';for(let i=0;i<5;i++){const r=document.createElement('div');r.className='ranger';r.innerHTML='<div class="head"><i class="visor"></i><i class="mouth"></i></div><div class="body"></div><div class="badge">★</div><i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i><i class="bike"></i>';team.appendChild(r)}}
function confetti(){const card=$('rewardCard'),colors=['#e84155','#327ce0','#ffd044','#2bbd76','#ee6cac','#fff'];card.querySelectorAll('.confetti').forEach(x=>x.remove());for(let i=0;i<90;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=colors[i%colors.length];c.style.animationDelay=(-Math.random()*3.4)+'s';c.style.animationDuration=(2.5+Math.random()*2)+'s';card.appendChild(c)}}
function showReward(){makeTeam();confetti();$('rewardLine').textContent=`Lesson ${currentLesson} 全${LESSONS[currentLesson].length}問クリア！ 5人の戦隊が全力でお祝いしています。`;$('reward').classList.add('show')}
function reportMail(){const name=$('studentName').value.trim()||'生徒';const list=LESSONS[currentLesson];const totalAttempts=list.reduce((s,q)=>s+(attempts[q.id]||0),0);const now=new Date().toLocaleString('ja-JP');const subject=encodeURIComponent(`【Heartening完了報告】${name} Lesson ${currentLesson}`);const body=encodeURIComponent(`Heartening Workbook Lesson ${currentLesson} を完了しました。\n\n名前：${name}\nLesson：${currentLesson} ${TITLES[currentLesson]}\n問題数：${list.length}問\nチェック回数：${totalAttempts}回\n完了日時：${now}\n\n期末試験に向けて大前進しました！`);location.href=`mailto:1216ssence@gmail.com?subject=${subject}&body=${body}`}
function openPdf(){const b64=$('answer-pdf-data').textContent.trim();if(!b64||b64.startsWith('__')){alert('答えPDFは別ファイルで開いてください。');return}const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download='Heartening_Lessons3-5_Answers.pdf';a.click()}setTimeout(()=>URL.revokeObjectURL(url),60000)}
document.querySelectorAll('.lesson-btn').forEach(b=>b.addEventListener('click',()=>selectLesson(b.dataset.lesson)));$('checkBtn').addEventListener('click',check);input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));$('resetBtn').addEventListener('click',()=>{if(confirm(`Lesson ${currentLesson} の進み具合を消して最初から始めますか？`)){localStorage.removeItem(keyFor(currentLesson));window._done={};attempts={};currentIndex=0;render()}});$('mailBtn').addEventListener('click',reportMail);$('closeReward').addEventListener('click',()=>$('reward').classList.remove('show'));$('pdfBtn').addEventListener('click',openPdf);$('studentName').addEventListener('change',()=>localStorage.setItem('heartening-student',$('studentName').value));$('studentName').value=localStorage.getItem('heartening-student')||$('studentName').value;
</script>
</body>
