    .overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(2,40,58,.76);backdrop-filter:blur(6px)}.overlay.show{display:grid}.modal{width:min(560px,100%);padding:clamp(26px,6vw,43px);border-radius:26px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center;position:relative;z-index:2;animation:pop .42s cubic-bezier(.18,.89,.32,1.28)}@keyframes pop{from{opacity:0;transform:scale(.76) translateY(22px)}to{opacity:1;transform:none}}.big{font-size:55px}.modal h2{margin:5px 0 9px;color:var(--deep);font-size:clamp(2rem,7vw,3rem)}.modal p{margin:0 auto 22px;max-width:440px;font-weight:750;line-height:1.7}.modal .primary{min-width:220px}#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

    @media(max-width:620px){.app{width:min(calc(100% - 18px),930px);padding-top:10px}.road{gap:4px}.pill{padding:7px 1px}.answer-row{grid-template-columns:1fr}.primary{width:100%}.feedback.show{align-items:stretch;flex-direction:column}.next{width:100%}.review-item{grid-template-columns:1fr auto}.review-meaning{grid-column:1/-1;grid-row:2}.badge{grid-column:2;grid-row:1}.finish-actions>*{width:100%}}

  <main class="app"><header><p class="eyebrow">Lesson 5 · Spelling Challenge</p><h1>Background Music and Sharks</h1><p class="sub">日本語と頭文字をヒントに、英語を完成させよう！</p></header><nav class="road" id="stageRoad"></nav>

  <div class="overlay" id="overlay"><canvas id="confetti"></canvas><div class="modal"><div class="big">🦈🎉</div><h2>やったね！</h2><p id="celebrateMessage"></p><button class="primary" id="continueBtn"></button></div></div>
  <script>
    "use strict";
    const stages=[
      {name:"Stage 1　海へ出発",words:[["shark","サメ"],["journal","専門誌、定期刊行物"],["mass","大衆の、大量の"],["sensationally","扇情的に、大げさに"],["statistically","統計的に"],["environmentalist","環境保護活動家"],["Jaws","『ジョーズ』（映画名）"],["terrorize","恐怖に陥れる"],["resort","行楽地、リゾート地"],["presence","存在、登場"],["accompany","～に伴う、添える"],["ominous","不吉な"],["documentary","ドキュメンタリー、記録映画"],["perception","認識、見方"],["willingness","意欲、進んでしようとする気持ち"],["determine","確かめる、決定する"],["split","分ける、分割する"]]},
      {name:"Stage 2　音楽の力",words:[["uplifting","気分を高揚させる"],["respectively","それぞれ、各々"],["strongly","強く、大いに"],["furthermore","さらに、その上"],["gauge","測る、評価する"],["conservation","保護、保全"],["measurement","測定"],["donation","寄付、寄付金"],["fund","基金、資金"],["dolphin","イルカ"],["implication","意味合い、影響"],["reliable","信頼できる"],["primary","主な、第一の"],["producer","制作者、プロデューサー"],["viewer","視聴者"],["interpretation","解釈"],["bias","偏らせる、先入観を持たせる"]]},
      {name:"Stage 3　音と感じ方",words:[["ruin","台なしにする、損なう"],["mislead","誤解させる、惑わせる"],["consumer","消費者"],["up-tempo","テンポの速い"],["beverage","飲み物、飲料"],["cognition","認知、認知機能"],["headphone","ヘッドホン"],["concentration","集中、集中力"],["moderate","適度な、中程度の"],["enhance","高める、向上させる"],["promote","促進する"],["decibel","デシベル（音量の単位）"],["particularly","特に"],["saltiness","塩味"],["sweetness","甘味"],["dull","鈍い、鈍らせる"]]},
      {name:"Stage 4　味と熟語",words:[["sensitivity","感度、敏感さ"],["crunchiness","カリカリした食感"],["unappetizing","食欲をそそらない"],["bass","低音"],["hum","ブーンという低い音"],["salty","塩辛い"],["sugary","砂糖のように甘い"],["crunchy","カリカリした"],["texture","食感、手触り"],["become rooted in","～に根づく、定着する"],["be likely to do","～しそうである、～する可能性が高い"],["be aware of","～を意識している、～に気づいている"],["in turn","今度は、順番に、その結果"],["throughout the ages","昔からずっと、あらゆる時代を通じて"],["in large part","大部分は"],["consist of","～から成る"]]},
      {name:"Stage 5　サメとゴール",words:[["gain support for","～への支持を得る"],["have an influence on","～に影響を与える"],["split A into B","AをBに分ける"],["without any sound","まったく音なしで"],["seem to indicate","～を示しているように思われる"],["be combined","組み合わされる"],["be set up to do","～するために設定される"],["regarding","～に関して"],["in regard to","～に関して"],["vote for","～に投票する"],["as follows","次のとおり"],["have implications for","～に重要な意味・影響を持つ"],["be viewed as","～とみなされる"],["primary source","主な情報源"],["be careful not to do","～しないよう注意する"],["be misled by","～に惑わされる、誤解させられる"]]}
    ].map((s,si)=>({...s,words:s.words.map((w,wi)=>({answer:w[0],meaning:w[1],id:`${si}-${wi}`}))}));
    const $=id=>document.getElementById(id),el={road:$("stageRoad"),stage:$("stageName"),counter:$("counter"),count:$("masteredCount"),meaning:$("meaning"),hint:$("hint"),input:$("answerInput"),check:$("checkBtn"),feedback:$("feedback"),feedbackText:$("feedbackText"),next:$("nextBtn"),bar:$("progressBar"),overlay:$("overlay"),message:$("celebrateMessage"),continue:$("continueBtn"),game:$("gameScreen"),finish:$("finishScreen"),reviewSummary:$("reviewSummary"),reviewList:$("reviewList"),playAgain:$("playAgainBtn"),reset:$("resetBtn"),confetti:$("confetti")};
    const KEY="lesson5-sharks-spelling-v1";let stageIndex=0,queue=[],current=null,mastered=new Set(),mistakes={},locked=false,qNo=0,confettiId=null;
    function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function norm(v){return v.normalize("NFKC").trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[‐‑‒–—−]/g,"-").replace(/[.?!…]+$/g,"").replace(/\s+/g," ")}function esc(v){return v.replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}function hint(v){return v.split(" ").map((w,i)=>{let first=false;return [...w].map(c=>{if(/[A-Za-z]/.test(c)){if(i===0&&!first){first=true;return c.toLowerCase()}return"_"}return c}).join("")}).join("  ")}function focusInput(){setTimeout(()=>{try{el.input.focus({preventScroll:true})}catch(_){el.input.focus()}},50)}
    function save(done=false){localStorage.setItem(KEY,JSON.stringify({stageIndex:Math.min(stageIndex,4),mastered:[...mastered],mistakes,done}))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||"null");if(!s)return;mistakes=s.mistakes||{};if(s.done){stageIndex=5;showFinish(false);return}if(Number.isInteger(s.stageIndex)&&s.stageIndex>=0&&s.stageIndex<5){stageIndex=s.stageIndex;mastered=new Set((s.mastered||[]).filter(id=>stages[stageIndex].words.some(w=>w.id===id)))}}catch(_){localStorage.removeItem(KEY)}}
    function road(){el.road.innerHTML=stages.map((_,i)=>`<div class="pill ${i<stageIndex?"done":i===stageIndex?"active":""}">Stage ${i<stageIndex?"✓":i+1}</div>`).join("")}function start(keep=true){if(!keep)mastered=new Set();queue=shuffle(stages[stageIndex].words.filter(w=>!mastered.has(w.id)));qNo=mastered.size;road();queue.length?nextQuestion():completeStage()}
    function nextQuestion(){locked=false;current=queue.shift();qNo++;let s=stages[stageIndex];el.stage.textContent=s.name;el.counter.textContent=`問題 ${qNo}（残り ${s.words.length-mastered.size}項目）`;el.count.textContent=`${mastered.size} / ${s.words.length}`;el.meaning.textContent=current.meaning;el.hint.textContent=hint(current.answer);el.input.value="";el.input.disabled=false;el.input.className="";el.check.disabled=false;el.feedback.className="feedback";el.feedbackText.innerHTML="";el.bar.style.width=`${mastered.size/s.words.length*100}%`;focusInput()}
    function check(){if(locked){advance();return}if(!el.input.value.trim()){focusInput();return}locked=true;let ok=norm(el.input.value)===norm(current.answer);el.input.disabled=true;el.check.disabled=true;el.feedback.classList.add("show");if(ok){mastered.add(current.id);el.input.classList.add("correct");el.feedback.classList.add("good");el.feedbackText.innerHTML=`<strong>正解！ ✨ ${esc(current.answer)}</strong><small>${esc(current.meaning)}</small>`;el.bar.style.width=`${mastered.size/stages[stageIndex].words.length*100}%`}else{queue.push(current);mistakes[current.id]=(mistakes[current.id]||0)+1;el.input.classList.add("wrong");el.feedback.classList.add("try");el.feedbackText.innerHTML=`<strong>おしい！ 正解は “${esc(current.answer)}”</strong><small>あとでもう一度出てくるよ。</small>`}save();el.count.textContent=`${mastered.size} / ${stages[stageIndex].words.length}`}
    function advance(){if(!locked)return;mastered.size===stages[stageIndex].words.length?completeStage():nextQuestion()}function completeStage(){let last=stageIndex===4,n=stages[stageIndex].words.length;el.message.textContent=last?`最後の${n}項目も全問正解！ 元気なサメが待っています。`:`${n}項目を全部マスターしました。ひと休みしたら次の海域へ！`;el.continue.textContent=last?"サメに会いに行く！ 🦈":"次のステージへ";el.overlay.classList.add("show");confetti()}
    function continueStage(){stopConfetti();el.overlay.classList.remove("show");if(stageIndex===4){stageIndex=5;mastered=new Set();save(true);showFinish(true)}else{stageIndex++;mastered=new Set();save();start(false)}}function renderReview(){let map=new Map(stages.flatMap(s=>s.words).map(w=>[w.id,w])),r=Object.entries(mistakes).filter(([id,n])=>map.has(id)&&n>0).map(([id,n])=>({...map.get(id),n})).sort((a,b)=>b.n-a.n);if(!r.length){el.reviewSummary.textContent="今回の記録では、確認が必要な項目はありません。";el.reviewList.innerHTML='<div class="perfect">🌟 全82項目、一発正解！ パーフェクト！</div>';return}el.reviewSummary.textContent=`一度でも間違えた${r.length}項目です。上にあるほど要チェック！`;el.reviewList.innerHTML=r.map(w=>`<div class="review-item"><div class="review-word">${esc(w.answer)}</div><div class="review-meaning">${esc(w.meaning)}</div><div class="badge ${w.n>=2?"priority":""}">${w.n>=2?"⚠ ":""}${w.n}回</div></div>`).join("")}
    function showFinish(burst=true){el.game.classList.add("hidden");el.finish.classList.add("show");renderReview();road();[...el.road.children].forEach(x=>{x.className="pill done";x.textContent="Stage ✓"});if(burst)confetti(4500,true)}function reset(){if(!confirm("記録を消してStage 1からやり直しますか？"))return;localStorage.removeItem(KEY);stopConfetti();stageIndex=0;mastered=new Set();mistakes={};el.overlay.classList.remove("show");el.finish.classList.remove("show");el.game.classList.remove("hidden");start(false)}
    function confetti(ms=3200,front=false){stopConfetti();let c=el.confetti;if(front){document.body.appendChild(c);c.style.zIndex="20"}else{el.overlay.prepend(c);c.style.zIndex="1"}let x=c.getContext("2d"),d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.scale(d,d);let colors=["#ffe29a","#27c3ca","#168db5","#55c990","#f2798b","#fff"],p=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.8,w:6+Math.random()*8,h:8+Math.random()*11,c:colors[Math.floor(Math.random()*colors.length)],s:2.5+Math.random()*4,r:Math.random()*6,d:-1.6+Math.random()*3.2})),t=performance.now();function f(n){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(a=>{a.y+=a.s;a.x+=a.d;a.r+=.09;if(a.y>innerHeight+20)a.y=-20;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=a.c;x.fillRect(-a.w/2,-a.h/2,a.w,a.h);x.restore()});n-t<ms?confettiId=requestAnimationFrame(f):stopConfetti()}confettiId=requestAnimationFrame(f)}function stopConfetti(){if(confettiId)cancelAnimationFrame(confettiId);confettiId=null;let x=el.confetti.getContext("2d");x.clearRect(0,0,el.confetti.width,el.confetti.height)}
    el.check.addEventListener("click",check);el.next.addEventListener("click",advance);el.input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();locked?advance():check()}});el.continue.addEventListener("click",continueStage);el.reset.addEventListener("click",reset);el.playAgain.addEventListener("click",reset);load();if(stageIndex<5)start(true);
  </script>
