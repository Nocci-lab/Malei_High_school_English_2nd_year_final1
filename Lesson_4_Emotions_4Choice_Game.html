  <style>

    .overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(42,24,54,.74);backdrop-filter:blur(6px)}.overlay.show{display:grid}.modal{width:min(560px,100%);padding:clamp(26px,6vw,43px);border-radius:26px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center;position:relative;z-index:2;animation:pop .42s cubic-bezier(.18,.89,.32,1.28)}@keyframes pop{from{opacity:0;transform:scale(.76) translateY(22px)}to{opacity:1;transform:none}}.modal-icon{font-size:53px}.modal h2{margin:4px 0 9px;color:var(--purple);font-size:clamp(1.9rem,6vw,2.8rem)}.modal p{margin:0 auto 21px;max-width:440px;font-weight:750;line-height:1.7}.primary,.spelling-link{display:inline-block;min-width:220px;padding:14px 20px;border:0;border-radius:14px;color:white;background:var(--purple);box-shadow:0 6px 0 #492268;text-align:center;text-decoration:none;font-weight:900;cursor:pointer}.primary:active,.spelling-link:active{transform:translateY(4px);box-shadow:0 2px 0 #492268}#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

<body>
  <main class="app">
    <header><p class="eyebrow">Lesson 4 · 4-Choice Warm-up</p><h1>Can You Feel Emotions in Text?</h1><p class="sub">意味と英語をすばやく結びつけよう！ 各ステージ2分30秒</p></header>
    <nav class="road" id="stageRoad" aria-label="ステージ進行状況"></nav>
    <section class="card game" id="gameScreen">
      <div class="top"><div><p class="stage-name" id="stageName"></p><p class="counter" id="counter"></p></div><div class="timer" id="timer">2:30</div></div>
      <div class="timer-track"><div class="timer-bar" id="timerBar"></div></div><div class="direction" id="direction">ランダム出題</div><p class="prompt" id="prompt">スタートボタンを押してください</p><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status" aria-live="polite">4つの中から答えを選ぼう！</div><div class="master-track"><div class="master-bar" id="masterBar"></div></div><p class="tip">選んだ瞬間に答え合わせ。間違えた項目は、正解するまで再登場します。</p>
    </section>
    <section class="finish" id="finishScreen">
      <h2>全ステージクリア！ 🎉</h2><p class="finish-sub">75項目すべて結びつけられました！</p><div class="speech">スペリングゲームで待ってるよ〜</div><div class="big-smile" aria-label="満面の笑みで手を振る絵文字"><span class="smile">😁</span><span class="wave">👋</span></div>
      <div class="finish-actions"><a class="spelling-link" href="Lesson_4_Emotions_Spelling_Game.html">スペリングゲームへ進む ✏️</a><button class="primary" id="playAgainBtn" type="button">4択をもう一度</button></div><div class="review-note" id="reviewNote"></div>
    </section>
    <div class="tools"><button class="reset" id="resetBtn" type="button">Stage 1からやり直す</button></div>
  </main>
  <div class="overlay show" id="overlay" role="dialog" aria-modal="true"><canvas id="confetti"></canvas><div class="modal"><div class="modal-icon" id="modalIcon">⏱️</div><h2 id="modalTitle">Stage 1</h2><p id="modalMessage"></p><button class="primary" id="modalButton" type="button">スタート！</button></div></div>
  <script>
    "use strict";
    const LIMIT=150000,KEY="lesson4-emotions-4choice-v1";
    const stages=[
      {name:"Stage 1　気持ちを伝えよう",words:[["emoticon","顔文字"],["emoji","絵文字"],["facial","顔の、表情の"],["misunderstanding","誤解"],["expand","広げる、拡大する"],["engaged","従事して、関わって"],["digital","デジタルの"],["subtle","微妙な、かすかな"],["nuance","ニュアンス、微妙な差"],["firstly","第一に"],["horizontal","横向きの、水平の"],["vertical","縦向きの、垂直の"],["analyze","分析する"],["tweet","ツイート、短文投稿"],["chart","図表、グラフ"]]},
      {name:"Stage 2　文化の違い",words:[["overwhelmingly","圧倒的に"],["actively","活発に、積極的に"],["interestingly","興味深いことに"],["Singapore","シンガポール"],["commonly","一般に、よく"],["secondly","第二に"],["shyness","恥ずかしさ"],["confusion","混乱、困惑"],["alien","なじみのない、異質な"],["thirdly","第三に"],["interpret","解釈する、読み取る"],["investigate","調査する"],["participant","参加者"],["evaluate","評価する"],["tend","～する傾向がある"]]},
      {name:"Stage 3　表情を読み取ろう",words:[["unlike","～と違って"],["lastly","最後に"],["Cameroon","カメルーン"],["Tanzania","タンザニア"],["sadness","悲しさ"],["utterly","まったく、完全に"],["baffled","当惑した"],["indicate","示す"],["universal","世界共通の、普遍的な"],["usage","使用法、用法"],["perceive","知覚する、捉える"],["entirely","完全に、すっかり"],["logically","論理的に"],["be engaged in","～に従事している、～に関わっている"],["be divided into","～に分けられる"]]},
      {name:"Stage 4　会話と表現",words:[["in other words","言い換えれば、つまり"],["by no means","決して～ない"],["in the first place","そもそも、第一に"],["What do you mean","どういう意味ですか"],["I've been wondering what you meant","あなたがどういう意味で言ったのか気になっています"],["Are you saying","～と言っているのですか"],["Where did you learn that","それをどこで知ったのですか"],["Who told you that","誰がそう言ったのですか"],["What made you think so","どうしてそう思ったのですか"],["visual","視覚の"],["grin","にっこり笑う"],["frown","しかめ面をする"],["embarrassed","恥ずかしい、当惑した"],["blush","赤面する"],["tease","からかう"]]},
      {name:"Stage 5　笑顔でゴール",words:[["affection","愛情"],["devilish","小悪魔のような"],["wicked","いたずらな、邪悪な"],["confident","自信のある"],["skeptical","疑い深い、懐疑的な"],["doubtful","疑わしい"],["hug","抱擁、抱きしめること"],["dressed with","～で和えた"],["season with","～で味つけする"],["wrap A in B","AをBで包む"],["top A with B","AにBをのせる"],["sprinkle A with B","AにBを散らす"],["dip A in B","AをBに浸す"],["serve A in a bowl","Aを丼で出す"],["roasted seaweed","焼き海苔"]]}
    ].map((s,si)=>({...s,words:s.words.map((w,wi)=>({answer:w[0],meaning:w[1],id:`${si}-${wi}`}))}));
    const $=id=>document.getElementById(id),el={road:$("stageRoad"),stage:$("stageName"),counter:$("counter"),timer:$("timer"),timerBar:$("timerBar"),direction:$("direction"),prompt:$("prompt"),choices:$("choices"),feedback:$("feedback"),masterBar:$("masterBar"),overlay:$("overlay"),icon:$("modalIcon"),title:$("modalTitle"),message:$("modalMessage"),modalButton:$("modalButton"),confetti:$("confetti"),game:$("gameScreen"),finish:$("finishScreen"),review:$("reviewNote"),playAgain:$("playAgainBtn"),reset:$("resetBtn")};
    let stageIndex=0,queue=[],current=null,mastered=new Set(),mistakes={},qNo=0,direction="ja-en",active=false,locked=false,deadline=0,timerId=null,nextId=null,action="start",confettiId=null;
    function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function esc(v){return v.replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}
    function save(done=false){localStorage.setItem(KEY,JSON.stringify({stageIndex:Math.min(stageIndex,4),mistakes,done}))}
    function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||"null");if(!s)return;mistakes=s.mistakes||{};if(s.done){stageIndex=5;showFinish(false);return}if(Number.isInteger(s.stageIndex)&&s.stageIndex>=0&&s.stageIndex<5)stageIndex=s.stageIndex}catch(_){localStorage.removeItem(KEY)}}
    function road(){el.road.innerHTML=stages.map((_,i)=>`<div class="pill ${i<stageIndex?"done":i===stageIndex?"active":""}">Stage ${i<stageIndex?"✓":i+1}</div>`).join("")}
    function idle(){let s=stages[stageIndex];el.stage.textContent=s.name;el.counter.textContent=`マスター 0 / ${s.words.length}`;el.timer.textContent="2:30";el.timer.classList.remove("urgent");el.timerBar.classList.remove("urgent");el.timerBar.style.width="100%";el.direction.textContent="ランダム出題";el.prompt.textContent="スタートボタンを押してください";el.choices.innerHTML="";el.feedback.className="feedback";el.feedback.textContent="日本語→英語／英語→日本語がランダムで出ます。";el.masterBar.style.width="0"}
    function startModal(){road();el.icon.textContent="⏱️";el.title.textContent=`Stage ${stageIndex+1}`;el.message.textContent=`15項目を2分30秒以内にマスターしよう。準備ができたらスタート！`;el.modalButton.textContent="スタート！";action="start";el.overlay.classList.add("show")}
    function startStage(){stopConfetti();clearTimeout(nextId);clearInterval(timerId);el.overlay.classList.remove("show");mastered=new Set();queue=shuffle(stages[stageIndex].words);qNo=0;active=true;locked=false;deadline=Date.now()+LIMIT;tick();timerId=setInterval(tick,250);road();nextQuestion()}
    function nextQuestion(){if(!active)return;locked=false;current=queue.shift();qNo++;direction=Math.random()<.5?"ja-en":"en-ja";let pool=stages[stageIndex].words.filter(w=>w.id!==current.id),opts=shuffle([current,...shuffle(pool).slice(0,3)]);el.stage.textContent=stages[stageIndex].name;el.counter.textContent=`マスター ${mastered.size} / 15　出題 ${qNo}`;el.direction.textContent=direction==="ja-en"?"日本語 → 英語":"英語 → 日本語";el.prompt.textContent=direction==="ja-en"?current.meaning:current.answer;el.feedback.className="feedback";el.feedback.textContent="4つの中から答えを選ぼう！";el.choices.innerHTML=opts.map((w,i)=>`<button class="choice" type="button" data-id="${w.id}"><span class="key">${i+1}</span><span>${esc(direction==="ja-en"?w.answer:w.meaning)}</span></button>`).join("");el.masterBar.style.width=`${mastered.size/15*100}%`;el.choices.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>choose(b)))}
    function choose(selected){if(!active||locked)return;locked=true;let ok=selected.dataset.id===current.id;el.choices.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.dataset.id===current.id){b.classList.add("correct");b.querySelector(".key").textContent="✓"}});if(ok){mastered.add(current.id);el.feedback.className="feedback good";el.feedback.textContent=`正解！ ${current.answer} ＝ ${current.meaning}`}else{selected.classList.add("wrong");selected.querySelector(".key").textContent="✕";mistakes[current.id]=(mistakes[current.id]||0)+1;queue.push(current);save();el.feedback.className="feedback try";el.feedback.textContent=`おしい！ ${current.answer} ＝ ${current.meaning}　あとでもう一度！`}el.counter.textContent=`マスター ${mastered.size} / 15　出題 ${qNo}`;el.masterBar.style.width=`${mastered.size/15*100}%`;nextId=setTimeout(()=>{if(!active)return;mastered.size===15?completeStage():nextQuestion()},ok?600:1150)}
    function tick(){if(!active)return;let left=Math.max(0,deadline-Date.now()),sec=Math.ceil(left/1000);el.timer.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;el.timerBar.style.width=`${left/LIMIT*100}%`;let urgent=left<=30000;el.timer.classList.toggle("urgent",urgent);el.timerBar.classList.toggle("urgent",urgent);if(left<=0)timeUp()}
    function stop(){active=false;locked=true;clearInterval(timerId);clearTimeout(nextId);timerId=null;nextId=null}
    function timeUp(){stop();el.choices.querySelectorAll(".choice").forEach(b=>b.disabled=true);el.icon.textContent="⌛";el.title.textContent="タイムアップ！";el.message.textContent=`${mastered.size} / 15項目までマスターできました。ひと休みして同じステージへ再挑戦！`;el.modalButton.textContent="もう一度スタート";action="retry";el.overlay.classList.add("show")}
    function completeStage(){let elapsed=LIMIT-Math.max(0,deadline-Date.now());stop();let sec=Math.round(elapsed/1000),time=`${Math.floor(sec/60)}分${String(sec%60).padStart(2,"0")}秒`,last=stageIndex===4;el.icon.textContent="🎉";el.title.textContent="やったね！";el.message.textContent=`15項目を${time}でクリア！ ${last?"満面の笑みの絵文字が待っています。":"次もこの調子！"}`;el.modalButton.textContent=last?"笑顔に会いに行く！ 😁":"次のステージへ";action=last?"finish":"next";el.overlay.classList.add("show");confetti();save()}
    function handleModal(){if(action==="start"||action==="retry"){startStage();return}if(action==="next"){stopConfetti();stageIndex++;save();idle();startModal();return}if(action==="finish"){stopConfetti();stageIndex=5;save(true);el.overlay.classList.remove("show");showFinish(true)}}
    function showFinish(burst=true){stop();el.overlay.classList.remove("show");el.game.classList.add("hidden");el.finish.classList.add("show");road();[...el.road.children].forEach(x=>{x.className="pill done";x.textContent="Stage ✓"});let all=stages.flatMap(s=>s.words),r=all.filter(w=>mistakes[w.id]>0).sort((a,b)=>(mistakes[b.id]||0)-(mistakes[a.id]||0));el.review.textContent=r.length?`4択で要チェックだった項目：${r.slice(0,9).map(w=>`${w.answer}（${mistakes[w.id]}回）`).join("、")}${r.length>9?` ほか${r.length-9}項目`:""}`:"4択は全問一発正解！ そのままスペリングゲームへ進もう！";if(burst)confetti(4400,true)}
    function reset(){if(!confirm("記録を消してStage 1からやり直しますか？"))return;localStorage.removeItem(KEY);stop();stopConfetti();stageIndex=0;mistakes={};el.finish.classList.remove("show");el.game.classList.remove("hidden");idle();startModal()}
    function confetti(ms=3200,front=false){stopConfetti();let c=el.confetti;if(front){document.body.appendChild(c);c.style.zIndex="20"}else{el.overlay.prepend(c);c.style.zIndex="1"}let x=c.getContext("2d"),d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.scale(d,d);let colors=["#ffd966","#db4f83","#8f65c2","#48b9dd","#55c990","#fff"],p=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.8,w:6+Math.random()*8,h:8+Math.random()*11,c:colors[Math.floor(Math.random()*colors.length)],s:2.5+Math.random()*4,r:Math.random()*6,d:-1.6+Math.random()*3.2})),t=performance.now();function f(n){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(a=>{a.y+=a.s;a.x+=a.d;a.r+=.09;if(a.y>innerHeight+20)a.y=-20;x.save();x.translate(a.x,a.y);x.rotate(a.r);x.fillStyle=a.c;x.fillRect(-a.w/2,-a.h/2,a.w,a.h);x.restore()});n-t<ms?confettiId=requestAnimationFrame(f):stopConfetti()}confettiId=requestAnimationFrame(f)}
    function stopConfetti(){if(confettiId)cancelAnimationFrame(confettiId);confettiId=null;let x=el.confetti.getContext("2d");x.clearRect(0,0,el.confetti.width,el.confetti.height)}
    el.modalButton.addEventListener("click",handleModal);el.reset.addEventListener("click",reset);el.playAgain.addEventListener("click",reset);document.addEventListener("keydown",e=>{if(!active||locked||e.target.tagName==="BUTTON")return;let n=Number(e.key),b=el.choices.children[n-1];if(n>=1&&n<=4&&b)choose(b)});load();if(stageIndex<5){idle();startModal()}
  </script>
